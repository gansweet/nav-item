name: CI（后端测试 + 前端构建）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 检查运行环境
        run: |
          node --version
          npm --version
          npm pkg get scripts

      - name: 安装依赖
        run: npm install

      - name: 后端测试
        run: npm test

      - name: 前端构建
        run: npm run build