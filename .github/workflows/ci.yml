name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies and build
        run: |
          if [ -d "web" ]; then
            cd web
            npm install
            npm run build
            cd ..
          fi

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test