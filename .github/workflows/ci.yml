name: CI（后端测试 + 前端构建）

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 后端测试（Node + D1 行为模拟）
        run: npm test
      - name: 前端构建
        run: npm run build
